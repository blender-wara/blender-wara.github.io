<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drehstromtransformator unsymmetrisch belastet</title>

<style>
:root{--line:#cfd4dc;--bg:#f4f6f9;--bad:#c4151c;--acc:#1f5fd1}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Arial,sans-serif;color:#111;background:var(--bg)}
main{max-width:1000px;margin:0 auto;padding:12px 16px 24px}
h1{margin:0 0 10px;font-size:20px}
.bar{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.bar label,.bar .g{font-size:13px;color:#555;display:flex;flex-direction:column;gap:4px}
select{font-size:20px;font-weight:700;padding:5px 10px;border:1px solid #999;border-radius:6px;background:#fff}
#tg{display:flex;gap:6px}
#tg button{font:inherit;font-size:16px;font-weight:700;padding:8px 14px;border:2px solid #999;border-radius:8px;background:#fff;cursor:pointer;color:#555}
#tg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#out{display:flex;gap:8px}
#tg2 button{font:inherit;font-size:16px;font-weight:700;padding:8px 14px;border:2px solid #999;border-radius:8px;background:#fff;cursor:pointer;color:#555}
#tg2 button.on{background:#1f5fd1;border-color:#1f5fd1;color:#fff}
.chip{border:1px solid var(--line);border-left-width:7px;border-radius:6px;padding:3px 10px;min-width:92px;background:#fff}
.chip small{display:block;color:#555;font-size:11px}
.chip b{font-size:20px}
.chip.bad{background:#fde8e8;border-color:var(--bad)}
.chip.bad b{color:var(--bad)}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;margin-top:12px}
svg{display:block;width:100%;height:auto}
#hint{margin:10px 2px 0;font-size:14px;color:#333;line-height:1.4}
@media(max-width:560px){#out{flex-wrap:wrap}}
</style>
</head>
<body>
<main>
<h1>Drehstromtransformator: unsymmetrische Belastung</h1>
<div class="bar">
<label>Schaltgruppe<select id="grp"><option>Yyn6</option><option>Dyn5</option><option>Yzn5</option></select></label>
<div class="g" id="pnbox">Primärseite<div id="tg2"><button id="pn">N anschließen</button></div></div>
<div class="g">Last an Außenleiter (ein/aus)<div id="tg"><button>L1</button><button>L2</button><button>L3</button></div></div>
<div class="g">Spannung sekundär (Strang)<div id="out"></div></div>
</div>
<div class="panel"><div id="diagram"></div></div>
<p id="hint"></p>
</main>
<script>
/* ==========================================================================
   Bauteilbibliothek Schaltzeichen (Elektrotechnik, Unterricht)
   Quelle der Symbole: Tabellenbuch Elektrotechnik (Europa-Lehrmittel), S. 86, 88, 481
   Eine Quelle für: Simulationen (HTML/SVG) und Schaltpläne für Word (SVG -> PNG).

   Koordinaten: SVG-Pixel, y nach unten. Bauteile sind senkrecht gezeichnet.
   Jede Funktion gibt einen SVG-Textabschnitt zurück (String). Mehrere Teile mit + verketten
   und mit SZ.svg(breite, hoehe, inhalt) zu einem vollständigen SVG machen.

   Feste Regeln (siehe README):
   - Bauteile nie um 180° drehen; Betätigung/Wirklinie immer von LINKS, Anschlussnummern rechts.
   - Geräte unbetätigt zeichnen (closed=false bei Schließer, closed=true bei Öffner).
   - Farben: top/bot = Farbe der Leitung oben/unten am Kontakt (rot = spannungsführend in Simulationen).
   ========================================================================== */
(function (root) {
  const C = { K: '#111', RED: '#e11d1d', BLUE: '#1f5fd1', PEY: '#f2c200', PEG: '#1a9a3a', GREY: '#444', FILL: '#fff', LIVE: '#ffe3e3' };
  const FONT = 'system-ui,Arial,sans-serif';

  /* ---------- Grundbausteine ---------- */
  const L = (x1, y1, x2, y2, c = C.K, w = 2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="square"/>`;
  const D = (x1, y1, x2, y2, c = C.GREY) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="1.3" stroke-dasharray="5 3"/>`;
  const T = (x, y, t, a = 'middle', sz = 11, f = C.K, w = 'normal') => `<text x="${x}" y="${y}" text-anchor="${a}" font-size="${sz}" fill="${f}" font-weight="${w}" font-family="${FONT}">${t}</text>`;
  const dot = (x, y, c = C.K) => `<circle cx="${x}" cy="${y}" r="3.4" fill="${c}"/>`;
  const box = (x, y, w, h, o = {}) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${o.fill || C.FILL}" stroke="${o.stroke || C.K}" stroke-width="${o.sw || 1.4}"/>`;
  const PE = (x1, y1, x2, y2) => L(x1, y1, x2, y2, C.PEY, 3) + `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${C.PEG}" stroke-width="3" stroke-dasharray="6 6"/>`;
  const svg = (w, h, inhalt, o = {}) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${o.width || w}" height="${o.height || h}">${o.bg ? `<rect width="${w}" height="${h}" fill="${o.bg}"/>` : ''}${inhalt}</svg>`;

  /* ---------- Antriebe (TBB S. 88): Symbol links, gestrichelte Wirklinie nach rechts bis xe ---------- */
  const wirk = (sx, ym, xe, c) => D(sx, ym, xe, ym, c);
  const antriebHand = (sx, ym, xe, c = C.GREY) => L(sx, ym - 9, sx, ym + 9, c, 1.6) + wirk(sx, ym, xe, c);
  const antriebDruecken = (sx, ym, xe, c = C.GREY) => L(sx, ym - 6, sx, ym + 6, c, 1.6) + L(sx, ym - 6, sx + 5, ym - 6, c, 1.6) + L(sx, ym + 6, sx + 5, ym + 6, c, 1.6) + wirk(sx, ym, xe, c);
  const antriebZiehen = (sx, ym, xe, c = C.GREY) => L(sx, ym - 6, sx, ym + 6, c, 1.6) + L(sx - 5, ym - 6, sx, ym - 6, c, 1.6) + L(sx - 5, ym + 6, sx, ym + 6, c, 1.6) + wirk(sx, ym, xe, c);
  const antriebDrehen = (sx, ym, xe, c = C.K) => L(sx, ym - 12, sx, ym + 12, c, 1.6) + L(sx, ym - 12, sx + 11, ym - 12, c, 1.6) + L(sx, ym + 12, sx - 11, ym + 12, c, 1.6) + wirk(sx, ym, xe, c);
  const antriebKippen = (sx, ym, xe, c = C.K) => L(sx, ym - 12, sx, ym + 12, c, 1.6) + L(sx - 9, ym - 12, sx + 9, ym - 12, c, 1.6) + wirk(sx, ym, xe, c);
  /* thermische Betätigung (Bimetall) am Hilfskontakt: Wirklinie startet bei sx+10 */
  const antriebThermisch = (sx, ym, xe, c = C.K) => `<path d="M${sx},${ym - 12} V${ym - 5} H${sx + 10} V${ym + 5} H${sx} V${ym + 12}" fill="none" stroke="${c}" stroke-width="1.6"/>` + wirk(sx + 10, ym, xe, c);
  const ANTRIEB = { hand: antriebHand, druecken: antriebDruecken, ziehen: antriebZiehen, drehen: antriebDrehen, kippen: antriebKippen, thermisch: antriebThermisch };
  const schaltschloss = (cx, cy) => box(cx - 8, cy - 8, 16, 16) + L(cx - 8, cy, cx + 8, cy, C.K, 1.2) + L(cx, cy - 8, cx, cy + 8, C.K, 1.2);

  /* ---------- Kontakt (einzeln) ---------- */
  /* typ 'NO' = Schließer, 'NC' = Öffner. closed = Kontakt geschlossen? top/bot = Leitungsfarbe.
     Öffner nach TBB S. 86: obere Leitung knickt nach rechts ab (feststehender Kontakt, waagerechter Strich),
     das Schaltmesser steigt von unten schräg nach rechts oben und liegt im Ruhezustand am Strich an.
     Betätigt (offen) schwenkt das Messer weiter nach rechts und liegt nicht mehr am Strich an. */
  const NCG = (yt, yb) => { const yc = yt + 10, bt = yt + 6, k = 0.42, d = k * (yb - bt); return { yc, bt, d, bw: Math.round(k * (yb - yc) + 9) }; };
  function kontakt(o) {
    const { x, yt, yb, typ = 'NO', closed = false } = o, top = o.top || C.K, bot = o.bot || top;
    if (typ === 'NC') {
      const g = NCG(yt, yb), len = Math.hypot(g.d, yb - g.bt), a = 45 * Math.PI / 180;
      let s = L(x, yt, x, g.yc, top) + L(x, g.yc, x + g.bw, g.yc, top);
      s += closed ? L(x, yb, x + g.d, g.bt, top === bot ? bot : top) : L(x, yb, x + len * Math.sin(a), yb - len * Math.cos(a), bot);
      return s;
    }
    /* Schließer: Messer gleich lang und gleich geneigt wie beim Öffner (Neigung 0,42), aber nach links */
    const dn = 0.42 * (yb - (yt + 6));
    return closed ? L(x, yt, x, yb, top) : L(x, yt, x, yt + 4, top) + L(x, yb, x - dn, yt + 6, bot);
  }
  /* Schaltglied mit Antrieb von links, BMK und Anschlussnummern (Taster, Schalter, Hilfskontakt, Meldekontakt) */
  function schaltglied(o) {
    const { x, yt, yb, typ = 'NO', antrieb = 'druecken', betaetigt = false, bmk, n1, n2 } = o;
    const closed = o.closed !== undefined ? o.closed : (typ === 'NC' ? !betaetigt : betaetigt);
    const ym = (yt + yb) / 2, c = betaetigt ? C.RED : (antrieb === 'thermisch' ? C.K : C.GREY);
    const sx = x - (antrieb === 'drehen' ? 36 : antrieb === 'thermisch' ? 41 : 31);
    let s = kontakt({ x, yt, yb, typ, closed, top: o.top, bot: o.bot });
    const xe = typ === 'NC' ? x + Math.round(0.42 * (yb - ym)) - 1 : x - Math.round(0.42 * (yb - ym)) + 1;
    if (antrieb) s += ANTRIEB[antrieb](sx, ym, xe, c);
    if (bmk) s += T(sx - (antrieb === 'drehen' ? 16 : 7), ym + 4, bmk, 'end', 12);
    if (n1) { const g = NCG(yt, yb), o1 = typ === 'NC' ? g.bw + 5 : 8, y1 = typ === 'NC' ? g.yc - 3 : yt + 9, y2 = typ === 'NC' ? yb + 9 : yb - 2; s += T(x + o1, y1, n1, 'start', 9, '#333') + T(x + 8, y2, n2, 'start', 9, '#333'); }
    return s;
  }

  /* ---------- Sicherung, Spule, Leuchte, Motor ---------- */
  function sicherung(o) { const { x, yt, yb } = o, top = o.top || C.K, bot = o.bot || top, ym = (yt + yb) / 2;
    return L(x, yt, x, ym - 14, top) + L(x, ym + 14, x, yb, bot) + box(x - 6, ym - 14, 12, 28) + L(x, ym - 14, x, ym + 14, C.K, 1.4) + (o.bmk ? T(x - 12, ym + 4, o.bmk, 'end', 12) : ''); }
  function spule(o) { const { x, yt, w = 52, h = 24, on = false, bmk = '-Q1' } = o;
    return box(x - w / 2, yt, w, h, { fill: on ? C.LIVE : C.FILL, sw: 1.6 }) + T(x + 5, yt - 4, o.a1 || 'A1', 'start', 9, '#333') + T(x + 5, yt + h + 11, o.a2 || 'A2', 'start', 9, '#333') + (bmk ? T(x - w / 2 - 7, yt + h / 2 + 4, bmk, 'end', 12) : ''); }
  function meldeleuchte(o) { const { cx, cy, r = 12, on = false, bmk } = o;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${on ? '#fff2a8' : C.FILL}" stroke="${C.K}" stroke-width="1.6"/>` + L(cx - r * .7, cy - r * .7, cx + r * .7, cy + r * .7, C.K, 1.4) + L(cx - r * .7, cy + r * .7, cx + r * .7, cy - r * .7, C.K, 1.4) + (bmk ? T(cx - r - 7, cy + 4, bmk, 'end', 12) : ''); }
  /* Motor 3~: Anschlüsse U1/V1/W1 liegen auf dem Kreis; xs = x der drei Zuleitungen, yIn = y des Leitungsendes oben */
  function motor3(o) { const { cx, cy, r = 28, xs, yIn, on = false, bmk = '-M1', farbe = C.K } = o; let s = '';
    xs.forEach((x, i) => { const y = cy - Math.sqrt(r * r - (x - cx) * (x - cx)); s += L(x, yIn, x, y, farbe) + T(i === 0 ? x - 4 : x + 4, y - 6, ['U1', 'V1', 'W1'][i], i === 0 ? 'end' : 'start', 9, '#333'); });
    s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${on ? C.LIVE : C.FILL}" stroke="${farbe}" stroke-width="2"/>` + T(cx, cy - 1, 'M', 'middle', 16, C.K, 'bold') + T(cx, cy + 14, '3~', 'middle', 11);
    return s + (bmk ? T(xs[0] - 34, cy + 4, bmk, 'end', 12) : ''); }

  /* ---------- Mehrpolige Geräte (xs = x-Positionen der Pole, Reihenfolge links -> rechts) ---------- */
  const NR = [['1', '2'], ['3', '4'], ['5', '6']];
  /* Schütz-Hauptkontakte (nur Kontakte, Wirklinie nach links zu -Q1) */
  function hauptkontakte3(o) { const { xs, yt, yb, closed = false, bmk = '-Q1' } = o, top = o.top || C.K, bot = o.bot || top; let s = '';
    xs.forEach((x, i) => { s += kontakt({ x, yt, yb, closed, top, bot }) + T(x + 4, yt - 4, NR[i][0], 'start', 9, '#333') + T(x + 4, yb + 14, NR[i][1], 'start', 9, '#333'); });
    return s + D(xs[xs.length - 1] - 4, (yt + yb) / 2, xs[0] - 30, (yt + yb) / 2) + T(xs[0] - 34, (yt + yb) / 2 + 4, bmk, 'end', 12); }
  /* Auslöserkasten (oben Bimetall, unten I>) – Pol-Leitungen enden oben und gehen unten weiter, laufen NICHT durch */
  function ausloeserKasten(o) { const { x1, x3, yt, h = 40 } = o, xm = (x1 + x3) / 2;
    return box(x1 - 14, yt, x3 - x1 + 28, h) + L(x1 - 14, yt + h / 2, x3 + 14, yt + h / 2, C.K, 1.2) +
      `<path d="M${xm - 8},${yt + 14} H${xm - 2} V${yt + 7} H${xm + 8}" fill="none" stroke="${C.K}" stroke-width="1.4"/>` + T(xm, yt + h - 5, 'I &gt;', 'middle', 11); }
  /* Motorschutzschalter (TBB S. 481): Antrieb -> Schaltschloss -> Wirklinie durch alle Kontakte; Wirklinie nach unten zu BEIDEN Zeilen des Kastens.
     antrieb: 'drehen' (Drehgriff), 'hand' (allgemein), 'kippen'. leistungsschalter:true setzt × an die Kontakte. uvoll:true = Unterspannungsauslöser U<.
     Bauhöhe: yt .. yt+88 (Kontakte yt..yt+36, Kasten yt+48..yt+88). Kein Strichpunkt-Rahmen (gehört nicht zum Symbol). */
  function mss3(o) { const { xs, yt, antrieb = 'drehen', bmk = '-F2', closed = false, uvoll = false, leistungsschalter = false } = o, top = o.top || C.K, bot = o.bot || top;
    const yb = yt + 36, ym = (yt + yb) / 2, x1 = xs[0], x3 = xs[xs.length - 1], xl = x1 - 52, ky = yt + 48; let s = '';
    xs.forEach((x, i) => { s += kontakt({ x, yt, yb, closed, top, bot }) + L(x, yb, x, ky, bot) + T(x + 4, yt - 6, NR[i][0], 'start', 9, '#333') + T(x + 4, ky + 54, NR[i][1], 'start', 9, '#333');
      if (leistungsschalter) s += L(x - 4, yt + 4, x + 4, yt + 12, C.K, 1.4) + L(x + 4, yt + 4, x - 4, yt + 12, C.K, 1.4); });
    s += ausloeserKasten({ x1, x3, yt: ky });
    s += ANTRIEB[antrieb](xl - 34, ym, xl - 8) + schaltschloss(xl, ym) + D(xl + 8, ym, x3 - 4, ym) + T(xl - 34 - (antrieb === 'drehen' ? 16 : 7), ym + 4, bmk, 'end', 12);
    s += D(xl, ym + 8, xl, ky + 34) + D(xl, ky + 14, x1 - 14, ky + 14) + D(xl, ky + 34, x1 - 14, ky + 34);
    if (uvoll) s += D(xl, ky + 34, xl, ky + 50) + box(xl - 12, ky + 50, 24, 18) + T(xl, ky + 63, 'U&lt;', 'middle', 10);
    return s; }
  /* FI-Schutzschalter 4-polig (L1 L2 L3 N): Antrieb durch Kippen, Schaltschloss, Summenstromwandler mit Auslöser I∆. Bauhöhe yt .. yt+36 (+ Wandler darunter bis yt+69) */
  function fi4(o) { const { xs, yt, bmk = '-F1', closed = false, farben } = o, yb = yt + 36, ym = (yt + yb) / 2, x1 = xs[0], xn = xs[xs.length - 1], xl = x1 - 52; let s = '';
    xs.forEach((x, i) => { const f = (farben && farben[i]) || {}; s += kontakt({ x, yt, yb, closed, top: f.top || C.K, bot: f.bot || f.top || C.K }); });
    s += antriebKippen(xl - 34, ym, xl - 8) + schaltschloss(xl, ym) + D(xl + 8, ym, xn - 4, ym) + T(xl - 48, ym + 4, bmk, 'end', 12);
    const ry = yb + 24;
    s += D(xl, ym + 8, xl, ry - 9) + `<ellipse cx="${(x1 + xn) / 2}" cy="${ry}" rx="${(xn - x1) / 2 + 14}" ry="9" fill="none" stroke="${C.K}" stroke-width="1.5"/>` + L((x1 + xn) / 2 - (xn - x1) / 2 - 14, ry, xl + 14, ry, C.K, 1.4) + box(xl - 14, ry - 9, 28, 18) + T(xl, ry + 4, 'I∆', 'middle', 10);
    return s; }
  /* Leitungsschutzschalter 3-polig (DIN EN 60617): je Pol Schließer + thermischer Auslöser (kleine Stufe) + elektromagnetischer Auslöser (Pfeil nach links);
     Wirklinie verbindet die Pole unten. STATUS: nach Beschreibung aus dem Skill gebaut, nicht gegen ein TBB-Bild geprüft. */
  function ls3(o) { const { xs, yt, bmk = '-F1', closed = false } = o, top = o.top || C.K, bot = o.bot || top, yb = yt + 50, x3 = xs[xs.length - 1]; let s = '';
    xs.forEach((x, i) => { s += kontakt({ x, yt, yb, closed, top, bot }) + T(x + 4, yt - 4, NR[i][0], 'start', 9, '#333') + T(x + 4, yb + 14, NR[i][1], 'start', 9, '#333');
      const bx = y => x - 0.42 * (yb - y); /* x-Lage des Messers auf Höhe y */
      s += `<path d="M${bx(yt + 14)},${yt + 14} h-6 v7 h-6" fill="none" stroke="${C.K}" stroke-width="1.4"/>`;
      s += L(bx(yt + 34), yt + 34, bx(yt + 34) - 10, yt + 34, C.K, 1.4) + `<polygon points="${bx(yt + 34) - 10},${yt + 34} ${bx(yt + 34) - 5},${yt + 31} ${bx(yt + 34) - 5},${yt + 37}" fill="${C.K}"/>`; });
    s += D(x3 - 4, yb - 6, xs[0] - 26, yb - 6) + T(xs[0] - 30, yb - 2, bmk, 'end', 12);
    return s; }
  /* Motorschutzrelais (Bimetallrelais, Drehstromgerät, TBB S. 88/481): ein Kasten über alle drei Pole, Bimetall-Zeichen in der Mitte */
  function motorschutzrelais3(o) { const { xs, yt, h = 40, bmk = '-F2' } = o, x1 = xs[0], x3 = xs[xs.length - 1], xm = (x1 + x3) / 2;
    return box(x1 - 14, yt, x3 - x1 + 28, h) + `<path d="M${xm - 5},${yt + h / 2 - 10} V${yt + h / 2 - 5} H${xm + 4} V${yt + h / 2 + 5} H${xm - 5} V${yt + h / 2 + 10}" fill="none" stroke="${C.K}" stroke-width="1.6"/>` + T(x1 - 20, yt + h / 2 + 4, bmk, 'end', 12); }


  /* ---------- Gleichstrom-Grundstromkreise (TBB S. 86, ergänzt Okt. 2026) ---------- */
  /* Widerstand allgemein (TBB S. 86): Rechteck, Leitung läuft von oben nach unten ein/aus. side 'l'/'r' = Seite der Beschriftung. */
  function widerstand(o) { const { x, yt, yb, h = 34, w = 14, bmk, wert, side = 'l' } = o, top = o.top || C.K, bot = o.bot || top, ym = (yt + yb) / 2, sx = side === 'l' ? -1 : 1, an = side === 'l' ? 'end' : 'start';
    let s = L(x, yt, x, ym - h / 2, top) + L(x, ym + h / 2, x, yb, bot) + box(x - w / 2, ym - h / 2, w, h, { sw: 1.8 });
    if (bmk) s += T(x + sx * (w / 2 + 7), ym + (wert ? -2 : 5), bmk, an, o.fs || 14);
    if (wert) s += T(x + sx * (w / 2 + 7), ym + 15, wert, an, (o.fs || 14) - 2, '#333');
    return s; }
  /* Galvanisches Element / Batterie (TBB S. 86): langer Strich = Pluspol (oben), kurzer dicker Strich = Minuspol (unten). */
  function batterie(o) { const { x, yt, yb, bmk = '-G1', wert } = o, top = o.top || C.K, bot = o.bot || top, ym = (yt + yb) / 2;
    let s = L(x, yt, x, ym - 6, top) + L(x, ym + 6, x, yb, bot) + L(x - 26, ym - 6, x + 26, ym - 6, C.K, 2) + L(x - 13, ym + 6, x + 13, ym + 6, C.K, 6) + T(x + 32, ym - 8, '+', 'start', 16);
    if (bmk) s += T(x + 32, ym + 20, bmk, 'start', o.fs || 14);
    if (wert) s += T(x + 32, ym + 42, wert, 'start', (o.fs || 14) - 1, '#333');
    return s; }
  /* lösbarer Anschluss (Klemme, offener Kreis, TBB S. 86) */
  function klemme(o) { const { x, y, label, dx = 12 } = o;
    return `<circle cx="${x}" cy="${y}" r="5" fill="#fff" stroke="${C.K}" stroke-width="2"/>` + (label ? T(x + dx, y + 5, label, 'start', o.fs || 14) : ''); }
  /* Spannungspfeil (blau) bzw. Strompfeil (rot) mit Pfeilspitze von (x0,y0) nach (x1,y1) */
  function pfeil(x0, y0, x1, y1, c = C.BLUE, w = 2) { const a = Math.atan2(y1 - y0, x1 - x0), l = 11, b = 0.42, p = (t) => `${x1 - l * Math.cos(a + t)},${y1 - l * Math.sin(a + t)}`;
    return L(x0, y0, x1 - 5 * Math.cos(a), y1 - 5 * Math.sin(a), c, w) + `<polygon points="${x1},${y1} ${p(b)} ${p(-b)}" fill="${c}"/>`; }

  /* ---------- Planrahmen ---------- */
  function pfadKopf(o) { const { x0 = 10, n, colW = 210, y = 6, h = 24 } = o; let s = '';
    for (let i = 0; i < n; i++) s += box(x0 + i * colW, y, colW, h, { fill: '#f3f4f6', stroke: '#666', sw: 1 }) + T(x0 + i * colW + colW / 2, y + 18, i + 1, 'middle', 13, C.K, 'bold');
    return s; }
  function kontaktspiegel(o) { const { x, y, rows, titel = 'Kontaktspiegel -Q1' } = o, w = 190, rh = 20, hh = rh * (rows.length + 1);
    let s = T(x + 2, y - 6, titel, 'start', 10, '#333', 'bold') + box(x, y, w, hh, { sw: 1 }) + L(x, y + rh, x + w, y + rh, C.K, 1) + L(x + 80, y, x + 80, y + hh, C.K, 1) + L(x + 130, y, x + 130, y + hh, C.K, 1);
    s += T(x + 40, y + 14, 'Kontakt', 'middle', 10) + T(x + 105, y + 14, 'S/Ö', 'middle', 10) + T(x + 160, y + 14, 'Pfad', 'middle', 10);
    rows.forEach((r, i) => { s += T(x + 40, y + 34 + rh * i, r[0], 'middle', 10) + T(x + 105, y + 34 + rh * i, r[1], 'middle', 10) + T(x + 160, y + 34 + rh * i, r[2], 'middle', 10); });
    return s; }

  const SZ = { C, L, D, T, dot, box, PE, svg, antriebHand, antriebDruecken, antriebZiehen, antriebDrehen, antriebKippen, antriebThermisch, schaltschloss,
    kontakt, schaltglied, sicherung, spule, meldeleuchte, widerstand, batterie, klemme, pfeil, motor3, hauptkontakte3, ausloeserKasten, mss3, fi4, ls3, motorschutzrelais3, pfadKopf, kontaktspiegel };
  if (typeof module !== 'undefined' && module.exports) module.exports = SZ; else root.SZ = SZ;
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
(function(){
'use strict';
/* ---------- komplexe Zahlen ---------- */
const C=(re,im)=>({re,im}), add=(a,b)=>C(a.re+b.re,a.im+b.im), sub=(a,b)=>C(a.re-b.re,a.im-b.im),
 mul=(a,b)=>C(a.re*b.re-a.im*b.im,a.re*b.im+a.im*b.re), sc=(a,k)=>C(a.re*k,a.im*k), ab=a=>Math.hypot(a.re,a.im),
 pol=(r,d)=>C(r*Math.cos(d*Math.PI/180),r*Math.sin(d*Math.PI/180));
const A1=pol(1,120), A2=pol(1,240), ZERO=C(0,0), UPH=400/Math.sqrt(3), I2N=60000/(Math.sqrt(3)*400);
const COL=['#8b5a2b','#111111','#7a7a7a'], LN=['L1','L2','L3'];
const fmt=(x,d=0)=>x.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});

/* ---------- Modell ---------- */
function model(g,on,s,cphi,ukPct,pn){
  const uk=ukPct/100, ur=0.3*uk, ux=Math.sqrt(uk*uk-ur*ur), Z1=C(ur,ux);
  const Z0=g==='Yyn6'?(pn?sc(Z1,0.9):C(0.05,0.40)):g==='Dyn5'?sc(Z1,0.9):sc(Z1,0.1);
  const phi=Math.acos(cphi), Ia=pol(s,-phi*180/Math.PI);
  const E=[C(1,0),A2,A1];
  const I=E.map((e,k)=>on[k]?mul(Ia,e):ZERO);
  const I0=sc(add(add(I[0],I[1]),I[2]),1/3);
  const I1=sc(add(add(I[0],mul(A1,I[1])),mul(A2,I[2])),1/3);
  const I2=sc(add(add(I[0],mul(A2,I[1])),mul(A1,I[2])),1/3);
  const d0=mul(Z0,I0), d1=mul(Z1,I1), d2=mul(Z1,I2);
  const dV=[add(add(d0,d1),d2), add(add(d0,mul(A2,d1)),mul(A1,d2)), add(add(d0,mul(A1,d1)),mul(A2,d2))];
  const V=E.map((e,k)=>sub(e,dV[k]));
  const Vv=V.map(v=>sc(v,UPH));
  const LL=[ab(sub(Vv[0],Vv[1])),ab(sub(Vv[1],Vv[2])),ab(sub(Vv[2],Vv[0]))];
  const shiftV=ab(d0)*UPH;
  const ca=I.map(x=>sc(x,I2N)); /* Sekundärströme in A */
  const Ca0=sc(I0,I2N);
  let coilP, lineP;  /* Wicklungsströme primär (A, komplex) und Netzstrom */
  if(g==='Yyn6'){ coilP=ca.map(x=>sc(pn?x:sub(x,Ca0),1/50)); lineP=coilP; }
  else if(g==='Dyn5'){ coilP=ca.map(x=>sc(x,1/(20000/UPH))); lineP=[sub(coilP[0],coilP[2]),sub(coilP[1],coilP[0]),sub(coilP[2],coilP[1])]; }
  else { coilP=[sc(sub(ca[0],ca[2]),1/86.603),sc(sub(ca[1],ca[0]),1/86.603),sc(sub(ca[2],ca[1]),1/86.603)]; lineP=coilP; }
  const prv=k=>I[(k+2)%3];
  let ths,thp,net;
  if(g==='Yyn6'){ ths=I.slice(); thp=I.map(x=>sc(pn?x:sub(x,I0),-1)); net=pn?ZERO:I0; }
  else if(g==='Dyn5'){ ths=I.slice(); thp=I.map(x=>sc(x,-1)); net=ZERO; }
  else { ths=I.map((x,k)=>sc(sub(x,prv(k)),1/Math.sqrt(3))); thp=ths.map(x=>sc(x,-1)); net=ZERO; }
  return {th:{s:ths,p:thp,net},Vv,V,LL,shiftV,I:ca,coilP,lineP,I0:ab(Ca0),dV0:sc(d0,-1)};
}
const TOL_LO=207,TOL_HI=253;


const st={g:'Yyn6',on:[true,false,false],pn:false};
const $=id=>document.getElementById(id);
const LOAD=1.0, CPHI=0.8, UK=4;
const PN=()=>st.pn&&st.g==='Yyn6';
function res(){return model(st.g,st.on,LOAD,CPHI,UK,PN());}
/* ---------- Schaltbild ---------- */
const X=[150,280,410], YB=[14,26,38], YO=[345,360,375], YN=440;
function coil(x,y0,col,n=4,r=10){ let d=`M${x},${y0}`; for(let i=0;i<n;i++) d+=` a${r},${r} 0 0 1 0,${2*r}`;
  return `<path d="${d}" fill="none" stroke="${col}" stroke-width="2.4"/>`; }
const act=a=>ab(a)>0.02;
function diagram(r){
  const g=st.g, S=SZ, RED=S.C.RED, BLUE=S.C.BLUE, K=S.C.K;
  let s='';
  /* Kern */
  const core='#dfe3ea';
  X.forEach(x=>s+=`<rect x="${x-5}" y="50" width="10" height="310" fill="${core}"/>`);
  s+=`<rect x="${X[0]-5}" y="48" width="${X[2]-X[0]+10}" height="9" fill="${core}"/><rect x="${X[0]-5}" y="353" width="${X[2]-X[0]+10}" height="9" fill="${core}"/>`;
  /* Netzschienen */
  ['1L1','1L2','1L3'].forEach((n,i)=>{s+=S.T(34,YB[i]+4,n,'end',11);});
  YB.forEach((y,i)=>{s+=S.L(40,y,470,y,RED,2);});
  s+=S.T(574,26,'3 ~ 50 Hz, 20 kV','start',12,'#c00','bold');
  YB.forEach((y,i)=>{ s+=S.T(478,y+4,'I'+(i+1)+' = '+fmt(ab(r.lineP[i]),2)+' A','start',11,act(r.lineP[i])?RED:'#666','bold'); });
  /* Primär */
  const y1=58, yc=66, y2=154;
  if(g==='Dyn5'){
    X.forEach((x,k)=>{
      s+=S.L(x,YB[k],x,y1,RED,2)+S.dot(x,YB[k],RED);
      const t=(k+1)%3; /* Ende von Spule k -> Anfang von Spule t */
    });
  } else X.forEach((x,k)=>{s+=S.L(x,YB[k],x,y1,RED,2)+S.dot(x,YB[k],RED);});
  X.forEach((x,k)=>{
    const c=act(r.coilP[k])?RED:K;
    s+=S.L(x,y1,x,yc,c,2)+coil(x,yc,c)+S.L(x,yc+80,x,y2,c,2);
    s+=S.T(x+22,yc+44,fmt(ab(r.coilP[k]),2)+' A','start',11,act(r.coilP[k])?RED:'#666','bold');
  });
  if(g==='Dyn5'){
    X.forEach((x,k)=>{
      const t=(k+1)%3, yl=162+8*k, xr=X[t]-26;
      s+=S.L(x,y2,x,yl,RED,2)+S.L(x,yl,xr,yl,RED,2)+S.L(xr,yl,xr,y1,RED,2)+S.L(xr,y1,X[t],y1,RED,2)+S.dot(X[t],y1,RED);
    });
    s+=S.T(X[0]-30,150,'Dreieck','end',10,'#a00');
  } else {
    s+=S.L(X[0],y2,X[2],y2,RED,2)+S.dot(X[1],y2,RED);
    if(PN()){
      const iNp=ab(add(add(r.coilP[0],r.coilP[1]),r.coilP[2])), onp=iNp>0.01;
      s+=S.L(X[2],y2,445,y2,BLUE,2)+S.L(445,y2,445,52,BLUE,2)+S.L(445,52,470,52,BLUE,2)+S.dot(X[2],y2,BLUE)
        +S.T(34,56,'1N','end',11,'#1f5fd1')+S.L(40,52,40,52,BLUE,2)
        +S.T(478,56,'I<tspan font-size="9" dy="3">N</tspan><tspan dy="-3"> = '+fmt(iNp,2)+' A</tspan>','start',11,onp?BLUE:'#888','bold');
      s+=S.L(X[0],y2,X[2],y2,BLUE,2)+S.dot(X[1],y2,BLUE);
    } else s+=S.T(X[2]+14,y2+4,'Sternpunkt (kein N)','start',10,'#a00');
  }
  s+='<g transform="translate(0,44)">';
  /* Sekundär */
  const t2=210,c2=218,b2=306;
  let busStart;
  if(g==='Yzn5'){
    busStart=X.map(x=>x-14);
    const xa=X.map(x=>x-14), xb=X.map(x=>x+14);
    for(let k=0;k<3;k++){
      const ia=r.I[k], ib=r.I[(k+2)%3];
      /* A_k: Strang k */
      s+=S.L(xa[k],t2,xa[k],c2,act(ia)?RED:K,2)+coil(xa[k],c2,act(ia)?RED:K,4,8)+S.L(xa[k],c2+64,xa[k],b2,act(ia)?RED:K,2);
      /* B_k: Strang k-1 */
      s+=S.L(xb[k],t2,xb[k],c2,act(ib)?RED:K,2)+coil(xb[k],c2,act(ib)?RED:K,4,8)+S.L(xb[k],c2+64,xb[k],b2,act(ib)?RED:K,2);
      if(act(ia)) s+=S.T(xa[k]-12,c2+30,fmt(ab(ia),1)+' A','end',10,RED,'bold');
      if(act(ib)) s+=S.T(xb[k]+22,c2+58,fmt(ab(ib),1)+' A','start',10,RED,'bold');
    }
    /* Reihenschaltung: A_k oben -> B_(k+1) oben */
    for(let k=0;k<3;k++){
      const n=(k+1)%3, yh=204-7*k;
      s+=S.L(xa[k],t2,xa[k],yh,RED,2)+S.L(xa[k],yh,xb[n],yh,RED,2)+S.L(xb[n],yh,xb[n],t2,RED,2);
    }
    /* Sternpunkt unten */
    const ys=326;
    xb.forEach(x=>s+=S.L(x,b2,x,ys,BLUE,2));
    s+=S.L(xb[0],ys,452,ys,BLUE,2)+S.dot(xb[1],ys,BLUE)+S.dot(xb[2],ys,BLUE);
    s+=S.L(452,ys,452,YN,BLUE,2);
    s+=S.T(500,236,'Zick-Zack: jeder Strang besteht','start',11,'#a00')+S.T(500,250,'aus 2 Teilspulen auf 2 Schenkeln','start',11,'#a00');
  } else {
    busStart=X.slice();
    X.forEach((x,k)=>{
      const c=act(r.I[k])?RED:K;
      s+=S.L(x,t2,x,c2,c,2)+coil(x,c2,c,4,10)+S.L(x,c2+80,x,b2,c,2);
      s+=S.T(x+22,c2+44,fmt(ab(r.I[k]),1)+' A','start',11,act(r.I[k])?RED:'#666','bold');
    });
    s+=S.L(X[0],t2,452,t2,BLUE,2)+S.dot(X[1],t2,BLUE)+S.dot(X[2],t2,BLUE)+S.L(452,t2,452,YN,BLUE,2);
  }
  /* Ausgangsschienen */
  YO.forEach((y,i)=>{
    s+=S.L(busStart[i],b2,busStart[i],y,RED,2)+S.L(busStart[i],y,620,y,RED,2);
  });
  s+=S.L(452,YN,620,YN,BLUE,2);
  if(g!=='Yzn5') s+=S.dot(452,t2,BLUE);
  { const iN=ab(add(add(r.I[0],r.I[1]),r.I[2])), on=iN>0.5;
    s+=S.T(462,300,'I<tspan font-size="9" dy="3">N</tspan><tspan dy="-3"> = '+fmt(iN,1)+' A</tspan>','start',14,on?BLUE:'#888','bold')+S.T(462,316,on?'Strom im Neutralleiter':'Neutralleiter stromlos','start',11,on?BLUE:'#888'); }
  /* Klemmen und Spannungen */
  ['2L1','2L2','2L3'].forEach((n,i)=>{
    const u=ab(r.Vv[i]), bad=u<TOL_LO||u>TOL_HI;
    s+=S.klemme({x:620,y:YO[i],label:'',fs:12})+S.T(632,YO[i]+4,n,'start',11,'#333','bold')+S.T(662,YO[i]+4,fmt(u,0)+' V','start',12,bad?'#c4151c':'#1a7f37','bold');
  });
  s+=S.klemme({x:620,y:YN,label:'',fs:12})+S.T(632,YN+4,'2N','start',11,'#1f5fd1','bold');
  /* Lasten */
  const LX=[505,550,595];
  const on=st.on;
  on.forEach((o,i)=>{ if(!o) return;
    s+=S.widerstand({x:LX[i],yt:YO[i],yb:YN,bmk:'R'+(i+1),top:RED,bot:BLUE,side:'r',fs:12})+S.dot(LX[i],YO[i],RED)+S.dot(LX[i],YN,BLUE);
  });
  on.forEach((o,i)=>{ if(o) return; s+=`<rect x="${LX[i]-4}" y="${YO[i]+22}" width="30" height="${YN-YO[i]-44}" fill="none" stroke="#aab" stroke-dasharray="4 3" rx="4"/>`+S.T(LX[i]+11,(YO[i]+YN)/2+4,'aus','middle',10,'#889'); });
  LX.forEach((x,i)=>{ s+=`<rect class="hit" data-i="${i}" x="${x-26}" y="${YO[i]+4}" width="52" height="${YN-YO[i]-8}" fill="transparent" style="cursor:pointer"/>`; });
  s+=S.T(34,YO[0]+4,'','end');
  s+=S.T(40,270,'','start');
  s+='</g>';
  /* Durchflutung je Schenkel (animiert) */
  const GY=210, SC=32, TH=r.th, violet='#7c3aed';
  X.forEach((x,k)=>{
    s+=S.L(x-30,GY,x+30,GY,'#b8bfcc',1);
    if(ab(TH.s[k])>0.02) s+=arr(x-20,GY,TH.s[k],RED,SC);
    if(ab(TH.p[k])>0.02) s+=arr(x,GY,TH.p[k],'#1f5fd1',SC);
    if(ab(TH.net)>0.02) s+=arr(x+20,GY,TH.net,violet,SC);
  });
  if(ab(TH.net)>0.02){
    s+=`<path d="M145,52 H104 V357 H145" fill="none" stroke="${violet}" stroke-width="2" stroke-dasharray="6 4"/>`+arr(104,GY,sc(TH.net,-3),violet,SC)+`<text transform="translate(94,205) rotate(-90)" text-anchor="middle" font-size="11" fill="${violet}" font-family="system-ui,Arial,sans-serif">Nullfluss über Luft und Kessel</text>`;
  }
  s+=S.T(490,180,'Durchflutung Θ je Schenkel','start',12,'#333','bold')+S.T(490,197,'rot: sekundär Θ₂','start',12,RED)+S.T(490,213,'blau: primär Θ₁','start',12,'#1f5fd1')+S.T(490,229,'violett: Rest (Θ₁ + Θ₂)','start',12,violet);
  const code=g==='Yyn6'?(PN()?'YNyn6':'Yyn6'):g==='Dyn5'?'Dyn5':'Yzn5';
  s+=S.T(20,110,code,'start',20,'#111','bold');
  return S.svg(740,504,s,{bg:'#fff'});
}


function arr(x,y,th,col,S){ return `<path class="arr" data-x="${x}" data-y="${y}" data-re="${th.re}" data-im="${th.im}" data-s="${S}" d="M${x},${y}" fill="none" stroke="${col}" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>`; }
function tick(ms){
  const w=2*Math.PI*0.25*ms/1000, c=Math.cos(w), sn=Math.sin(w);
  document.querySelectorAll('.arr').forEach(p=>{
    const x=+p.dataset.x,y=+p.dataset.y,v=(+p.dataset.re*c-+p.dataset.im*sn)*(+p.dataset.s), tip=y-v, sg=v>=0?1:-1, a=Math.min(9,Math.abs(v)*0.6+1);
    p.setAttribute('d',Math.abs(v)<1?`M${x},${y}`:`M${x},${y} V${tip} M${x-5},${tip+sg*a} L${x},${tip} L${x+5},${tip+sg*a}`);
  });
  requestAnimationFrame(tick);
}
const HINT={
 'Yyn6':'Yyn6: Die Last erzeugt Θ₂ nur im belasteten Schenkel. Primär fließt kein Nullstrom (Stern ohne Neutralleiter), deshalb verteilt sich Θ₁ auf alle drei Schenkel. Es bleibt eine Rest-Durchflutung (violett), in allen Schenkeln gleichgerichtet. Ihr Fluss kann nicht über den Kern zurück und läuft über Luft und Kessel: Nullfluss, Sternpunktverschiebung.',
 'YNyn6':'YNyn6: Der primäre Neutralleiter führt den Nullstrom aus dem Netz. Θ₁ hebt Θ₂ in jedem Schenkel auf, es bleibt keine Rest-Durchflutung (kein violett). Kein Nullfluss über Luft und Kessel, die Spannung des belasteten Strangs bricht nur noch wie bei Dyn5 ein. Voraussetzung: das 20-kV-Netz hat einen herausgeführten Sternpunkt.',
 'Dyn5':'Dyn5: Das Dreieck führt einen Ausgleichsstrom im selben Schenkel. Θ₁ hebt Θ₂ in diesem Schenkel auf, die anderen Schenkel bleiben unbeteiligt. Keine Rest-Durchflutung, kein Nullfluss: wie ein einphasiger Transformator.',
 'Yzn5':'Yzn5: Jeder Strang liegt auf zwei Schenkeln (Zick-Zack). Θ₂ teilt sich auf zwei Schenkel auf, gegensinnig. Primär gleicht in denselben zwei Schenkeln aus. Keine Rest-Durchflutung, kein Nullfluss.'};
function render(){
  const r=res();
  $('diagram').innerHTML=diagram(r);
  document.querySelectorAll('#tg button').forEach((b,i)=>b.classList.toggle('on',st.on[i]));
  let h='';
  r.Vv.forEach((v,i)=>{const u=ab(v), bad=u<TOL_LO||u>TOL_HI;
    h+=`<div class="chip ${bad?'bad':''}" style="border-left-color:${COL[i]}"><small>U<sub>${LN[i]}N</sub></small><b>${fmt(u,0)} V</b></div>`;});
  $('out').innerHTML=h;
  $('hint').textContent=HINT[PN()?'YNyn6':st.g];
  $('pnbox').style.display=st.g==='Yyn6'?'':'none'; $('pn').classList.toggle('on',st.pn);
  document.querySelectorAll('.hit').forEach(e=>e.onclick=()=>{const i=+e.dataset.i;st.on[i]=!st.on[i];render();});
}
$('grp').onchange=e=>{st.g=e.target.value;render();};
$('pn').onclick=()=>{st.pn=!st.pn;render();};
document.querySelectorAll('#tg button').forEach((b,i)=>b.onclick=()=>{st.on[i]=!st.on[i];render();});
render();
requestAnimationFrame(tick);
})();
</script>
