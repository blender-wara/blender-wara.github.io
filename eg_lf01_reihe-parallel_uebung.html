<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Übung Reihen- und Parallelschaltung</title>
<style>
  :root { --ink:#1c2430; --muted:#5b6675; --line:#d5dbe3; --bg:#f4f6f9; --card:#fff; --blue:#1f5fbf; --red:#c00000; --ok:#1d7a3e; --okbg:#e6f4ea; --nobg:#fdeaea; --tip:#fff8e1; --tipline:#e0a800; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; color:var(--ink); background:var(--bg); line-height:1.45; }
  header { background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  .bar { max-width:900px; margin:0 auto; padding:10px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .bar h1 { font-size:18px; margin:0; flex:1 1 260px; }
  .track { height:8px; width:140px; background:var(--line); border-radius:4px; overflow:hidden; }
  .track i { display:block; height:100%; width:0; background:var(--ok); transition:width .3s; }
  .score { font-weight:bold; white-space:nowrap; }
  main { max-width:900px; margin:0 auto; padding:16px; }
  h2 { font-size:20px; margin:28px 0 8px; border-bottom:2px solid var(--ink); padding-bottom:4px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin:12px 0; }
  .card h3 { margin:0 0 6px; font-size:16px; }
  .stamm { display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
  .stamm > div { flex:1 1 300px; }
  .stamm img, .stamm svg { max-width:100%; height:auto; }
  .teil { border-top:1px solid var(--line); margin-top:10px; padding-top:10px; }
  .teil:first-of-type { border-top:0; }
  .zeile { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .zeile .frage { flex:1 1 280px; }
  input[type=text] { font:inherit; width:100px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; text-align:right; }
  input.ok { border-color:var(--ok); background:var(--okbg); } input.no { border-color:var(--red); background:var(--nobg); }
  .einheit { min-width:26px; color:var(--muted); }
  button { font:inherit; padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; }
  button:hover { border-color:var(--blue); }
  button.pruefen { background:var(--blue); color:#fff; border-color:var(--blue); }
  .opt { display:block; margin:6px 0; padding:8px 10px; border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  .opt.ok { background:var(--okbg); border-color:var(--ok); } .opt.no { background:var(--nobg); border-color:var(--red); }
  .fb { min-height:1.3em; font-size:14px; margin-top:4px; } .fb.ok { color:var(--ok); } .fb.no { color:var(--red); }
  .hilfen { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .tipp { background:var(--tip); border-left:4px solid var(--tipline); padding:8px 10px; margin-top:8px; font-size:15px; }
  .loesung { border:3px solid var(--red); color:var(--red); padding:8px 10px; margin-top:8px; font-size:15px; }
  .note { color:var(--muted); font-size:14px; }
  @media print { header { position:static; } button { display:none; } }
</style>
</head>
<body>
<header><div class="bar">
  <h1 id="titel"></h1>
  <div class="track"><i id="prog"></i></div>
  <div class="score"><span id="pts">0</span> / <span id="max">0</span> richtig</div>
  <button id="reset">Neu starten</button>
</div></header>
<main id="app"></main>

// ===================== AB HIER NICHTS ÄNDERN =====================
const $ = (s, r = document) => r.querySelector(s);
const el = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const zahl = (s) => parseFloat(String(s).trim().replace(',', '.').replace(/[^0-9.\-]/g, ''));
let geloest, gesamt;
function werte(id, ok) { ok ? geloest.add(id) : geloest.delete(id); $('#pts').textContent = geloest.size; $('#prog').style.width = (gesamt ? 100 * geloest.size / gesamt : 0) + '%'; }

function hilfen(box, t) {            // eigene Tipps und Lösung je Teilaufgabe
  const leiste = el('<div class="hilfen"></div>'), feld = el('<div></div>');
  let stufe = 0; const tipps = t.tipps || [];
  if (tipps.length) { const b = el('<button class="tippknopf">Tipp</button>');
    b.onclick = () => { if (stufe < tipps.length) { feld.append(el(`<div class="tipp"><b>Tipp${tipps.length > 1 ? ' ' + (stufe + 1) : ''}:</b> ${tipps[stufe]}</div>`)); stufe++; }
      if (stufe >= tipps.length) b.disabled = true; else b.textContent = 'Noch ein Tipp'; };
    leiste.append(b); }
  if (t.loesung) { const l = el(`<div class="loesung" hidden><b>Lösung:</b> ${t.loesung}</div>`), b = el('<button class="loesungsknopf">Lösung zeigen</button>');
    b.onclick = () => { l.hidden = !l.hidden; b.textContent = l.hidden ? 'Lösung zeigen' : 'Lösung verbergen'; }; leiste.append(b); feld.append(l); }
  box.append(leiste, feld);
}

function teilaufgabe(a, t, i, einzeln) {
  const id = a.nr + (einzeln ? '' : 'abcdefgh'[i]); gesamt++;
  const marke = einzeln ? '' : `<b>${'abcdefgh'[i]})</b> `;
  const box = el('<div class="teil"></div>'), fb = el('<div class="fb"></div>');
  if (t.typ === 'zahl') {
    const z = el(`<div class="zeile"><span class="frage">${marke}${t.frage}</span><input type="text" inputmode="decimal" aria-label="Antwort ${id}"><span class="einheit">${t.einheit || ''}</span><button class="pruefen">Prüfen</button></div>`);
    const inp = $('input', z);
    const check = () => { const x = zahl(inp.value); if (isNaN(x)) { fb.className = 'fb no'; fb.textContent = 'Gib eine Zahl ein.'; return; }
      const ok = Math.abs(x - t.wert) <= Math.max(0.0011, Math.abs(t.wert) * 0.005);
      inp.className = ok ? 'ok' : 'no'; fb.className = 'fb ' + (ok ? 'ok' : 'no'); fb.textContent = ok ? 'Richtig!' : 'Noch nicht richtig. Nutze den Tipp zu dieser Teilaufgabe.'; werte(id, ok); };
    $('button', z).onclick = check; inp.onkeydown = (e) => { if (e.key === 'Enter') check(); };
    box.append(z, fb);
  } else if (t.typ === 'auswahl') {
    box.append(el(`<div class="frage">${marke}${t.frage}</div>`));
    t.optionen.forEach((o, k) => { const b = el(`<div class="opt" tabindex="0" role="button">${o}</div>`);
      const go = () => { box.querySelectorAll('.opt').forEach(x => x.className = 'opt'); const ok = k === t.richtig; b.className = 'opt ' + (ok ? 'ok' : 'no');
        fb.className = 'fb ' + (ok ? 'ok' : 'no'); fb.textContent = ok ? 'Richtig!' : 'Das stimmt nicht. Nutze den Tipp zu dieser Teilaufgabe.'; werte(id, ok); };
      b.onclick = go; b.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') go(); }; box.append(b); });
    box.append(fb);
  } else {                           // "selbst": auf Papier lösen, dann mit der Lösung vergleichen und abhaken
    box.append(el(`<div class="frage">${marke}${t.frage}</div>`));
    const c = el('<label class="note"><input type="checkbox"> Ich habe meine Lösung verglichen und sie stimmt.</label>');
    $('input', c).onchange = (e) => werte(id, e.target.checked); box.append(c);
  }
  hilfen(box, t); return box;
}

function bauen() {
  const app = $('#app'); app.innerHTML = ''; geloest = new Set(); gesamt = 0;
  document.title = UEBUNG.titel; $('#titel').textContent = UEBUNG.titel;
  UEBUNG.teile.forEach(teil => { app.append(el(`<h2>${teil.titel}</h2>`));
    teil.aufgaben.forEach(a => { const c = el(`<div class="card"><h3>Aufgabe ${a.nr}${a.titel ? ': ' + a.titel : ''}</h3></div>`);
      if (a.stamm || a.bild) c.append(el(`<div class="stamm"><div>${a.stamm || ''}</div>${a.bild || ''}</div>`));
      const einzeln = a.teilaufgaben.length === 1;
      a.teilaufgaben.forEach((t, i) => c.append(teilaufgabe(a, t, i, einzeln))); app.append(c); }); });
  if (UEBUNG.quelle) app.append(el(`<p class="note">${UEBUNG.quelle}</p>`));
  $('#max').textContent = gesamt; werte('', false);
}
$('#reset').onclick = () => { bauen(); window.scrollTo(0, 0); };
bauen();
</script>
